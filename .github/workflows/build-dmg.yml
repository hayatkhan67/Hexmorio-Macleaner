name: Build macOS app

on:
  push:
    branches: [main, mac_app]
    tags: ["v*"]
  pull_request:
    branches: [main, mac_app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: StorageOptimizerNative
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        run: |
          chmod +x build.sh package-dmg.sh
          ./build.sh
          ./package-dmg.sh

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: StorageOptimizer-dmg
          path: StorageOptimizerNative/dist/*.dmg

      - name: Attach dmg to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: StorageOptimizerNative/dist/*.dmg
